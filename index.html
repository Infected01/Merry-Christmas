<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyrics to ASCII Art Visualizer</title>
  <style>
    :root {
      --color-primary: #ee75d2;
      --color-secondary: #75d8ee;
      --color-tertiary: #deee75;
      --color-quaternary: #9375ee;
      --color-surface: #271c22;
      --brightness: 1.4;
      font-size: 80%;
    }

    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000000;
      color: var(--color-primary);
      overflow: hidden;
      font-family: sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    #output {
      position: relative;
      text-align: center;
      font-family: "SF Mono", monospace;
      overflow: hidden;
      filter: drop-shadow(
          0 0 7rem color-mix(in srgb, var(--color), transparent 20%)
        )
        brightness(var(--brightness));
      white-space: nowrap;
      background: black;
      font-size: 12px;
      line-height: 1;
    }

    #prerender {
      display: none;
      position: absolute;
      left: 0;
      top: 0;
    }

    * {
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<div class="container">
  <div id="output">
    <div style="font-size: 20px; font-weight: bold; padding: 20px;">
      ▶ KLIK/TAP DI SINI UNTUK MULAI
    </div>
  </div>
</div>

<!-- Audio Source -->
<audio id="bg-music" src="Merry Christmas (Please Don't Call, I Miss You) - Bleachers & Alex Crichton.mp3"></audio>

<canvas id="prerender" width="150" height="50"></canvas>

<script>
  (() => {
    const config = {
      lyrics: [
        // Intro Musik (Disesuaikan dengan jeda vokal masuk)
        { text: "♪ MUSIC INTRO ♪", showMs: 8500, hideMs: 1200 },

        // Verse 1
        { text: "The dimple of your eyelid", showMs: 2200, hideMs: 600 },
        { text: "Is the flicker of a streetlight", showMs: 2500, hideMs: 600 },
        { text: "You know this moment, don't you?", showMs: 2800, hideMs: 700 },
        { text: "And time is strange like standard time", showMs: 3200, hideMs: 600 },
        { text: "'Cause everybody's promised", showMs: 2400, hideMs: 500 },
        { text: "It's just you and your anger", showMs: 2600, hideMs: 1200 },

        // Verse 2
        { text: "Oh, golden boy", showMs: 1800, hideMs: 400 },
        { text: "Don't act like you're kind", showMs: 2200, hideMs: 400 },
        { text: "You're mind, but you're awful every time", showMs: 3200, hideMs: 600 },
        { text: "So don't tell what you told me", showMs: 2200, hideMs: 400 },
        { text: "Don't hold me like you know me", showMs: 2200, hideMs: 400 },
        { text: "I would rather burn forever", showMs: 2800, hideMs: 1000 },

        // Chorus 1
        { text: "But you should know", showMs: 1800, hideMs: 300 },
        { text: "That I die slow", showMs: 1800, hideMs: 300 },
        { text: "Running through the halls", showMs: 1800, hideMs: 300 },
        { text: "Of your haunted home", showMs: 1800, hideMs: 500 },
        { text: "And the toughest part", showMs: 1800, hideMs: 300 },
        { text: "Is that we both know", showMs: 1800, hideMs: 300 },
        { text: "What happened to you", showMs: 1800, hideMs: 300 },
        { text: "Why you're out on your own", showMs: 2200, hideMs: 600 },
        { text: "Merry Christmas", showMs: 1800, hideMs: 400 },
        { text: "Please don't call", showMs: 2500, hideMs: 2000 },

        // Verse 3
        { text: "You left me on the line, kid", showMs: 2500, hideMs: 400 },
        { text: "Holding all your baggage", showMs: 2500, hideMs: 400 },
        { text: "You know one's not your father", showMs: 2500, hideMs: 400 },
        { text: "Set welcome to standard time", showMs: 2500, hideMs: 300 },
        { text: "On flickers like a streetlight", showMs: 2500, hideMs: 300 },
        { text: "And flickers through the darkness", showMs: 3000, hideMs: 1000 },

        { text: "Oh, golden boy", showMs: 2000, hideMs: 300 },
        { text: "You shine a light on your home", showMs: 3000, hideMs: 300 },
        { text: "And at your best, you're a magical soul", showMs: 3500, hideMs: 500 },
        { text: "Don't tell 'em what you told me", showMs: 2500, hideMs: 300 },
        { text: "Don't even tell 'em that you know me", showMs: 2500, hideMs: 300 },
        { text: "I would rather burn forever", showMs: 3000, hideMs: 1000 },

        // Chorus 2
        { text: "But you should know", showMs: 1800, hideMs: 300 },
        { text: "That I die slow", showMs: 1800, hideMs: 300 },
        { text: "Running through the halls", showMs: 1800, hideMs: 300 },
        { text: "Of your haunted home", showMs: 1800, hideMs: 500 },
        { text: "And the toughest part", showMs: 1800, hideMs: 300 },
        { text: "Is that we both know", showMs: 1800, hideMs: 300 },
        { text: "What happened to you", showMs: 1800, hideMs: 300 },
        { text: "Why you're out on your own", showMs: 2200, hideMs: 600 },
        { text: "Merry Christmas", showMs: 1800, hideMs: 400 },
        { text: "Please don't call", showMs: 2500, hideMs: 2000 },

        // Bridge
        { text: "I want one ticket out of your heavy gaze", showMs: 3000, hideMs: 500 },
        { text: "I want one ticket off your carousel", showMs: 3000, hideMs: 500 },
        { text: "I want one ticket out of your heavy gaze", showMs: 3000, hideMs: 500 },
        { text: "I want one ticket off your carousel", showMs: 3000, hideMs: 1000 },

        // Chorus 3
        { text: "But you should know", showMs: 1800, hideMs: 300 },
        { text: "That I die slow", showMs: 1800, hideMs: 300 },
        { text: "Running through the halls", showMs: 1800, hideMs: 300 },
        { text: "Of your haunted home", showMs: 1800, hideMs: 500 },
        { text: "And the toughest part", showMs: 1800, hideMs: 300 },
        { text: "Is that we both know", showMs: 1800, hideMs: 300 },
        { text: "What happened to you", showMs: 1800, hideMs: 300 },
        { text: "Why you're out on your own", showMs: 2200, hideMs: 600 },
        { text: "Merry Christmas", showMs: 1800, hideMs: 400 },
        { text: "Please don't call", showMs: 2500, hideMs: 500 },
        { text: "Merry Christmas, I'm not yours at all", showMs: 3500, hideMs: 500 },
        { text: "Merry Christmas, please don't call", showMs: 3500, hideMs: 1500 },

        // Outro
        { text: "So what if I call?", showMs: 2500, hideMs: 500 },
        { text: "And you pick up the phone?", showMs: 2500, hideMs: 500 },
        { text: "And I use this holiday", showMs: 2500, hideMs: 300 },
        { text: "To make my way to your ghost?", showMs: 3000, hideMs: 1000 },

        { text: "Oh, what if you're lonely?", showMs: 2500, hideMs: 500 },
        { text: "And you know I am too?", showMs: 2500, hideMs: 500 },
        { text: "And I get the chance to say", showMs: 2500, hideMs: 300 },
        { text: "Merry Christmas, I miss you", showMs: 3000, hideMs: 500 },
        { text: "I miss you...", showMs: 3000, hideMs: 1000 },

        { text: "So I'll hang the lights up", showMs: 2500, hideMs: 300 },
        { text: "You'll see them from space", showMs: 2500, hideMs: 500 },
        { text: "And all that I want on my list", showMs: 2500, hideMs: 300 },
        { text: "Is that look on your face", showMs: 2500, hideMs: 1000 },

        { text: "When I said November's early to be playing these songs", showMs: 4000, hideMs: 500 },
        { text: "Now when I look back, I can see I was wrong", showMs: 4000, hideMs: 1000 },

        { text: "So what if I call?", showMs: 2500, hideMs: 500 },
        { text: "And you pick up the phone?", showMs: 2500, hideMs: 500 },
        { text: "And I use this holiday", showMs: 2500, hideMs: 300 },
        { text: "To make my way to your ghost?", showMs: 3000, hideMs: 1000 },

        { text: "Oh, what if you're lonely?", showMs: 2500, hideMs: 500 },
        { text: "And you know I am too?", showMs: 2500, hideMs: 500 },
        { text: "And I get the chance to say", showMs: 2500, hideMs: 300 },
        { text: "Merry Christmas, I miss you", showMs: 3000, hideMs: 500 },
        { text: "I miss you...", showMs: 3000, hideMs: 1000 },

        { text: "You know it's true", showMs: 2500, hideMs: 500 },
        { text: "Yeah, I miss you", showMs: 2500, hideMs: 500 },
        { text: "You know it's true...", showMs: 3000, hideMs: 1000 },

        { text: "So what if I call?", showMs: 2500, hideMs: 500 },
        { text: "And you pick up the phone?", showMs: 2500, hideMs: 500 },
        { text: "And I use this holiday", showMs: 2500, hideMs: 300 },
        { text: "To make my way to your ghost?", showMs: 3000, hideMs: 1000 },

        { text: "Oh, what if you're lonely?", showMs: 2500, hideMs: 500 },
        { text: "And you know I am too?", showMs: 2500, hideMs: 500 },
        { text: "And I get the chance to say", showMs: 2500, hideMs: 300 },
        { text: "Merry Christmas, I miss you", showMs: 3000, hideMs: 500 },
        { text: "I miss you...", showMs: 4000, hideMs: 3000 },
        { text: "♪ END ♪", showMs: 5000, hideMs: 1000 }
      ],
      isLooping: false,      
      maxColorIndex: 700    
    };

    const canvas = document.getElementById("prerender");
    const output = document.getElementById("output");
    const audio = document.getElementById("bg-music");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    const charsFixed = [
      "_", ".", ",", "-", "=", "+", "i", "s", "c", "b", "a", "!", "?",
      "0", "1", "2", "3", "4", "5", "6",
      ["9", "8"],
      ["✚", "✚", "✚", "✚", "✚", "⚛︎"],
      ["☺︎", "☹︎︎"],
      "☀︎",
      ["@", "#"],
      ["X", "Y", "Z"],
      "'"
    ];

    let chars = [...charsFixed];
    let charsLength = chars.length;
    
    let currentLyricIndex = 0;
    let lastTime = 0;
    let timeAccumulator = 0;
    let isShowing = true;
    let isStarted = false;

    const drawTextToCanvas = (time) => {
      const w = canvas.width;
      const h = canvas.height;

      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, w, h);

      if (!isShowing) return; 

      const currentText = config.lyrics[currentLyricIndex].text;

      ctx.fillStyle = "white"; 
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      
      const fontSize = 14; 
      ctx.font = `900 ${fontSize}px "Arial Black", Impact, sans-serif`;
      
      const words = currentText.split(" ");
      let lines = [];
      let currentLine = words[0] || "";

      for (let i = 1; i < words.length; i++) {
        let word = words[i];
        let width = ctx.measureText(currentLine + " " + word).width;
        if (width < w - 10) { 
          currentLine += " " + word;
        } else {
          lines.push(currentLine);
          currentLine = word;
        }
      }
      lines.push(currentLine);

      const lineHeight = fontSize + 2; 
      const totalHeight = lines.length * lineHeight;
      
      let startY = (h / 2) - (totalHeight / 2) + (lineHeight / 2);

      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], w / 2, startY + (i * lineHeight));
      }
    };

    const updateASCII = (time) => {
      if (!isStarted) return;

      if (lastTime === 0) lastTime = time;
      const deltaTime = time - lastTime;
      lastTime = time;
      timeAccumulator += deltaTime;

      const currentLyric = config.lyrics[currentLyricIndex];
      const currentPhaseDuration = isShowing ? currentLyric.showMs : currentLyric.hideMs;

      if (timeAccumulator > currentPhaseDuration) {
        timeAccumulator = 0;
        if (isShowing) {
          isShowing = false;
        } else {
          isShowing = true;
          currentLyricIndex++;
          if (currentLyricIndex >= config.lyrics.length) {
            currentLyricIndex = config.isLooping ? 0 : config.lyrics.length - 1;
          }
        }
      }

      drawTextToCanvas(time);

      const w = canvas.width;
      const h = canvas.height;
      const data = ctx.getImageData(0, 0, w, h).data;

      let outputText = "";
      
      for (let y = 0; y < h; y++) {
        let row = "";
        for (let x = 0; x < w; x++) {
          const index = (x + y * w) * 4;
          const r = data[index];
          const g = data[index + 1];
          const b = data[index + 2];
          
          const c = (r + g + b) / 3;

          const charIndex = Math.floor(
            (charsLength * ((c * 100) / config.maxColorIndex)) / 100
          );
          
          const safeCharIndex = Math.min(Math.max(charIndex, 0), charsLength - 1);
          const result = chars[safeCharIndex];
          
          const char = Array.isArray(result)
            ? result[Math.floor(Math.random() * result.length)]
            : result;

          row += `<span style="color: rgb(${r}, ${g}, ${b});">${char ?? "&nbsp;"}</span>`;
        }
        outputText += `<div>${row}</div>`;
      }

      output.innerHTML = outputText;
      output.style.setProperty("--color", `rgb(${data[0]}, ${data[1]}, ${data[2]})`);

      requestAnimationFrame(updateASCII);
    };

    window.addEventListener("click", () => {
      if (!isStarted) {
        isStarted = true;
        audio.currentTime = 0;
        audio.play().catch(e => console.log("Audio play error:", e));
        requestAnimationFrame(updateASCII);
      }
    });

  })();
</script>

</body>
</html>
